
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android project
        run: |
          ZIP=$(find . -maxdepth 2 -name '*.zip' | head -1)
          if [ -n "$ZIP" ]; then
            mkdir source
            unzip -q "$ZIP" -d source
          fi
          PROJECT=$(find . -name settings.gradle.kts -o -name settings.gradle | head -1 | xargs dirname)
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      
      - name: Align Java and Kotlin versions
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["PROJECT_DIR"]) / "app/build.gradle.kts"
          s = p.read_text()
          s += """

          tasks.withType<JavaCompile>().configureEach {
              sourceCompatibility = "17"
              targetCompatibility = "17"
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions.jvmTarget = "17"
          }
          """
          p.write_text(s)
          PY

