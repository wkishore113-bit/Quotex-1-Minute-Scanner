
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir -p source
          ZIP="./Quotex_1m_Android_Scanner_Source (2).zip"

          if [ ! -f "$ZIP" ]; then
            echo "Latest project ZIP not found: $ZIP"
            ls -la
            exit 1
          fi

          unzip -q "$ZIP" -d source

          PROJECT=$(find source \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit | xargs dirname)

          if [ -z "$PROJECT" ]; then
            echo "Gradle project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Align Java and Kotlin versions
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          p = Path(os.environ["PROJECT_DIR"]) / "app/build.gradle.kts"
          s = p.read_text()

          block = """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """

          s, count = re.subn(r'android\s*\{', block, s, count=1)

          if count == 0:
              raise SystemExit("Android configuration not found")

          p.write_text(s)
          print("Java compatibility set to 17")
          PY

      - name: Check Gradle files
        run: |
          echo "Project directory: $PROJECT_DIR"
          find source -maxdepth 6 -type f | sort | head -100
          find source \( -name gradlew -o -name gradle-wrapper.properties \)

      - name: Build Android APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          elif command -v gradle >/dev/null 2>&1; then
            gradle assembleDebug
          else
            echo "Gradle wrapper and system Gradle are missing"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Quotex-Scanner-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
