
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle --version

      - name: Extract Android project
        run: |
          mkdir -p source
          ZIP="./Quotex_1m_Android_Scanner_Source (2).zip"

          if [ ! -f "$ZIP" ]; then
            echo "Project ZIP not found"
            exit 1
          fi

          unzip -q "$ZIP" -d source

          python3 - <<'PY'
          import os
          from pathlib import Path

          settings = next(
              (p for p in Path("source").rglob("settings.gradle*") if p.is_file()),
              None
          )

          if settings is None:
              raise SystemExit("Gradle settings file not found")

          project = settings.parent.resolve()
          print("Project directory:", project)

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"PROJECT_DIR={project}\n")
          PY

      - name: Align Java version
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          p = Path(os.environ["PROJECT_DIR"]) / "app/build.gradle.kts"

          if not p.exists():
              raise SystemExit("app/build.gradle.kts not found")

          s = p.read_text()

          block = """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """

          s, count = re.subn(r'android\s*\{', block, s, count=1)

          if count == 0:
              raise SystemExit("Android configuration not found")

          p.write_text(s)
          print("Java compatibility set to 17")
          PY

      - name: Check project files
        run: |
          echo "Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"
          ls -la "$PROJECT_DIR/app"

      - name: Build Android APK
        run: |
          cd "$PROJECT_DIR"
          /tmp/gradle-8.9/bin/gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Quotex-Scanner-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
